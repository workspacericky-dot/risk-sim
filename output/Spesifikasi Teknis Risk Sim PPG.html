  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-family:var(--font-ui);font-size:12px\">faktor_penyebab<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top\">Dinormalisasi ke daftar baku.<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--ink-1)\">K<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px\">penyebab<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top\">Narasi penyebab.<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--ink-1)\">N<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px\">control_text<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top\">Kontrol sumber; belum otomatis menjadi Control Library.<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--ink-1)\">P<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px\">mitigation_text<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top\">Dapat menjadi draf mitigasi operasional.<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <div style=\"border:1.5px solid var(--effect-edge);margin:18px 0 0;break-inside:avoid\">\n    <div style=\"background:var(--effect-node);color:#fff;padding:5px 12px;font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase\">Batasan<\u002Fdiv>\n    <p style=\"margin:0;padding:12px;color:var(--ink-1)\"><span style=\"font-family:var(--font-ui);font-size:12.5px\">kategori<\u002Fspan>, <span style=\"font-family:var(--font-ui);font-size:12.5px\">proses_bisnis<\u002Fspan>, <span style=\"font-family:var(--font-ui);font-size:12.5px\">subproses_bisnis<\u002Fspan>, residual K/D, dan treated K/D tetap kosong karena tidak tersedia secara andal pada template. Sistem dilarang merekayasa nilai tersebut.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"margin:30px 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">3.2 &nbsp;Dua mode impor<\u002Fh3>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:16px;break-inside:avoid\">\n    <div style=\"border:1.5px solid var(--cause-node)\">\n      <div style=\"background:var(--cause-node);color:#fff;padding:7px 12px;font-family:var(--font-ui);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Bootstrap Library<\u002Fdiv>\n      <ol style=\"margin:0;padding:12px 12px 12px 30px;font-size:13.5px;line-height:1.5\">\n        <li style=\"margin-bottom:4px\">Parser menghasilkan baris staging.<\u002Fli>\n        <li style=\"margin-bottom:4px\">Nama unit dicocokkan secara exact-normalized ke master unit.<\u002Fli>\n        <li style=\"margin-bottom:4px\">Risiko dibandingkan dengan Risk Library aktif.<\u002Fli>\n        <li style=\"margin-bottom:4px\">Match ≥ 88 dipetakan ke library.<\u002Fli>\n        <li style=\"margin-bottom:4px\">Sisanya dibandingkan dengan kandidat terbuka.<\u002Fli>\n        <li style=\"margin-bottom:4px\">Similarity ≥ 72 digabung ke kandidat; selain itu dibuat kandidat baru.<\u002Fli>\n        <li>UPG Pusat memeriksa evidence members dan mengambil keputusan.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--cause-node)\">\n      <div style=\"background:var(--cause-node);color:#fff;padding:7px 12px;font-family:var(--font-ui);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Operational Assessment<\u002Fdiv>\n      <ol style=\"margin:0;padding:12px 12px 12px 30px;font-size:13.5px;line-height:1.5\">\n        <li style=\"margin-bottom:4px\">Parser menghasilkan staging milik pengunggah.<\u002Fli>\n        <li style=\"margin-bottom:4px\">Unit UPG Satker dipaksakan dari profil autentikasi.<\u002Fli>\n        <li style=\"margin-bottom:4px\">Inherent K/D diisi dari workbook bila valid.<\u002Fli>\n        <li style=\"margin-bottom:4px\">User memilih generic risk dan mengisi residual K/D.<\u002Fli>\n        <li>Server membuat <span style=\"font-family:var(--font-ui);font-size:12px\">ppg_register<\u002Fspan> berstatus <span style=\"font-family:var(--font-ui);font-size:12px\">draft<\u002Fspan> dan, bila ada, <span style=\"font-family:var(--font-ui);font-size:12px\">ppg_mitigations<\u002Fspan>.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"margin:30px 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">3.3 &nbsp;Normalisasi dan similarity<\u002Fh3>\n  <figure style=\"margin:0 0 16px;break-inside:avoid\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n      <span style=\"border:1.5px solid var(--ink-1);padding:7px 11px;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-1)\">NFKD<\u002Fspan>\n      <span style=\"color:var(--connector);font-size:14px\">→<\u002Fspan>\n      <span style=\"border:1.5px solid var(--ink-1);padding:7px 11px;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-1)\">lowercase id-ID<\u002Fspan>\n      <span style=\"color:var(--connector);font-size:14px\">→<\u002Fspan>\n      <span style=\"border:1.5px solid var(--ink-1);padding:7px 11px;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-1)\">hapus non-alfanumerik<\u002Fspan>\n      <span style=\"color:var(--connector);font-size:14px\">→<\u002Fspan>\n      <span style=\"border:1.5px solid var(--ink-1);padding:7px 11px;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-1)\">rapikan spasi<\u002Fspan>\n    <\u002Fdiv>\n    <figcaption style=\"margin-top:9px;font-family:var(--font-ui);font-size:11px;line-height:1.5;color:var(--ink-3)\">Gambar 2 — Rantai normalisasi teks sebelum penghitungan similarity.<\u002Ffigcaption>\n  <\u002Ffigure>\n  <p style=\"margin:0 0 14px\">Stop words umum dikeluarkan sebelum Jaccard token similarity. Skor kandidat:<\u002Fp>\n\n  <div style=\"border:1.5px solid var(--ink-1);padding:16px 18px;margin:0 0 14px;break-inside:avoid\">\n    <div style=\"font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">Skor kandidat &nbsp;S = 100 × jumlah kontribusi<\u002Fdiv>\n    <div style=\"display:grid;gap:7px;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">\n      <div style=\"display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:6px\"><span style=\"text-align:right;font-weight:600;color:var(--cause-node)\">0,70<\u002Fspan><span>sim(peristiwa)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:6px\"><span style=\"text-align:right;font-weight:600;color:var(--cause-node)\">0,10<\u002Fspan><span>sim(penyebab)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:6px\"><span style=\"text-align:right;font-weight:600;color:var(--cause-node)\">0,05<\u002Fspan><span>sim(dampak)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:6px\"><span style=\"text-align:right;font-weight:600;color:var(--cause-node)\">0,10<\u002Fspan><span>exact(klasifikasi)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:baseline\"><span style=\"text-align:right;font-weight:600;color:var(--cause-node)\">0,05<\u002Fspan><span>exact(faktor_penyebab)<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 12px\">Jika nama aktivitas sebelum pemisah <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">–<\u002Fspan>, <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">—<\u002Fspan>, atau <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">:<\u002Fspan> identik dan panjangnya memadai, skor minimum dinaikkan menjadi 92. Aturan ini hanya membentuk usulan; source rows tetap tersedia untuk human review.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"bab-4\" style=\"break-before:page;padding-top:12px\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 4<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Core Engine: Penilaian Risiko<\u002Fh2>\n\n  <h3 style=\"margin:22px 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">4.1 &nbsp;Formula<\u002Fh3>\n  <div style=\"border:1.5px solid var(--ink-1);padding:18px;margin:0 0 16px;text-align:center;break-inside:avoid\">\n    <div style=\"font-family:var(--font-ui);font-size:16px;font-weight:600;letter-spacing:.02em;color:var(--ink-1)\">Skor risiko = Kemungkinan × Dampak<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 16px\">Kedua input berupa bilangan bulat 1–5. Mapping level:<\u002Fp>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.45;margin-bottom:20px\">\n    <sc-raw-thead style=\"font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);text-align:left\">\n      <sc-raw-tr style=\"border-bottom:1.5px solid var(--ink-1)\">\n        <sc-raw-th style=\"padding:0 10px 7px 0;width:18%;text-align:right\">Skor<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:0 0 7px 12px\">Level<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;text-align:right;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">1–5<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 12px;vertical-align:top\">Sangat Rendah<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;text-align:right;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">6–11<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 12px;vertical-align:top\">Rendah<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;text-align:right;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">12–15<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 12px;vertical-align:top\">Sedang<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;text-align:right;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">16–19<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 12px;vertical-align:top\">Tinggi<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;text-align:right;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">20–25<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 12px;vertical-align:top\">Sangat Tinggi<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <p style=\"margin:0 0 14px\">Formula yang sama diterapkan pada tiga titik ukur:<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;break-inside:avoid\">\n    <div style=\"border:1.5px solid var(--cause-node);padding:12px\">\n      <div style=\"font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--cause-node);margin-bottom:7px\">Inherent<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.45;margin-bottom:10px\">Sebelum kontrol.<\u002Fdiv>\n      <div style=\"border-top:1px solid var(--hairline);padding-top:8px;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">K=5, D=4 → 20<br>Sangat Tinggi<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--cause-node);padding:12px\">\n      <div style=\"font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--cause-node);margin-bottom:7px\">Residual<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.45;margin-bottom:10px\">Setelah kontrol yang sedang berjalan.<\u002Fdiv>\n      <div style=\"border-top:1px solid var(--hairline);padding-top:8px;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">K=4, D=4 → 16<br>Tinggi<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--cause-node);padding:12px\">\n      <div style=\"font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--cause-node);margin-bottom:7px\">Treated<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.45;margin-bottom:10px\">Setelah treatment Program PPG.<\u002Fdiv>\n      <div style=\"border-top:1px solid var(--hairline);padding-top:8px;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">K=2, D=3 → 6<br>Rendah<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"bab-5\" style=\"margin-top:38px\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 5<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Core Engine: Insight A<\u002Fh2>\n  <p style=\"margin:0 0 18px\">Insight A adalah indeks paparan berbasis laporan gratifikasi, bukan probabilitas kejadian. Method version: <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">exposure-components-v2<\u002Fspan>.<\u002Fp>\n\n  <h3 style=\"margin:0 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">5.1 &nbsp;Komponen dan normalisasi<\u002Fh3>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.4\">\n    <sc-raw-thead style=\"font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);text-align:left\">\n      <sc-raw-tr style=\"b px 0;vertical-align:top;color:var(--ink-1)\">Konsentrasi jabatan<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top\">Share laporan unik pada kelompok jabatan dominan<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:11.5px\">share × 100<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top;text-align:right;font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--cause-node)\">20%<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;color:var(--ink-1)\">Paparan objek berisiko<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top\">Item uang/setara uang ÷ seluruh item<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:11.5px\">share × 100<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top;text-align:right;font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--cause-node)\">15%<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;color:var(--ink-1)\">Pertumbuhan paparan<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top\">Perubahan laporan unik terhadap periode setara sebelumnya<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:11.5px\">clamp(max(0, growth) × 100, 0, 100)<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top;text-align:right;font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--cause-node)\">10%<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u0 eri, dan momen:<\u002Fp>\n  <div style=\"border:1.5px solid var(--ink-1);padding:16px 18px;margin:0 0 14px;break-inside:avoid\">\n    <div style=\"font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);margin-bottom:12px\">exposure_score = 100 × jumlah kontribusi<\u002Fdiv>\n    <div style=\"display:grid;gap:7px;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">\n      <div style=\"display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:6px\"><span style=\"text-align:right;font-weight:600;color:var(--cause-node)\">0,50<\u002Fspan><span>percentile_rank(jumlah_laporan)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:6px\"><span style=\"text-align:right;font-weight:600;color:var(--cause-node)\">0,30<\u002Fspan><span>percentile_rank(log(1 + nilai))<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:baseline\"><span style=\"text-align:right;font-weight:600;color:var(--cause-node)\">0,20<\u002Fspan><span>percentile_rank(proporsi_item_uang)<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0\">Ranking ini mendukung eksplorasi, sedangkan skor Insight A menggunakan lima komponen pada §5.1.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"bab-6\" style=\"break-before:page;padding-top:12px\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 6<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Core Engine: Insight B<\u002Fh2>\n  <p style=\"margin:0 0 12px\">Insight B mengukur realisasi aktual per risiko generik dengan sumber <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">ppg_loss_events<\u002Fspan> berstatus <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">tervalidasi<\u002Fspan>, <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">tindak_lanjut<\u002Fspan>, atau <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">ditutup<\u002Fspan>.<\u002Fp>\n  <p style=\"margin:0 0 16px\">Penyebut seluruh indikator adalah jumlah seluruh satker pada <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">unit_kerja<\u002Fspan>:<\u002Fp>\n\n  <div style=\"border:1.5px solid var(--ink-1);padding:16px 18px;margin:0 0 18px;break-inside:avoid;display:grid;gap:9px;font-family:var(--font-ui);font-size:12px;color:var(--ink-1);line-height:1.4\">\n    <div style=\"border-bottom:1px solid var(--hairline);padding-bottom:8px\"><span style=\"font-weight:600\">affected_pct<\u002Fspan> = distinct_satker_with_event ÷ eligible_satkers × 100<\u002Fdiv>\n    <div style=\"border-bottom:1px solid var(--hairline);padding-bottom:8px\"><span style=\"font-weight:600\">high_impact_pct<\u002Fspan> = distinct_satker_with_any_level_4_5 ÷ eligible_satkers × 100<\u002Fdiv>\n    <div style=\"border-bottom:1px solid var(--hairline);padding-bottom:8px\"><span style=\"font-weight:600\">recurring_pct<\u002Fspan> = distinct_satker_with_2_or_more_events ÷ eligible_satkers × 100<\u002Fdiv>\n    <div><span style=\"font-weight:600\">control_failure_pct<\u002Fspan> = distinct_satker_with_failure_text ÷ eligible_satkers × 100<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;break-inside:avoid\">\n    <div style=\"border:1.5px solid var(--ink-1);padding:14px 16px\">\n      <div style=\"font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);margin-bottom:11px\">Skor B = clamp(jumlah, 0, 100)<\u002Fdiv>\n      <div style=\"display:grid;gap:6px;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">\n        <div style=\"display:grid;grid-template-columns:26px 1fr;gap:12px\"><span style=\"text-align:right;font-weight:600;color:var(--effect-node)\">2×<\u002Fspan><span>affected_pct<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:26px 1fr;gap:12px\"><span style=\"text-align:right;font-weight:600;color:var(--effect-node)\">4×<\u002Fspan><span>high_impact_pct<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:26px 1fr;gap:12px\"><span style=\"text-align:right;font-weight:600;color:var(--effect-node)\">4×<\u002Fspan><span>recurring_pct<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:26px 1fr;gap:12px\"><span style=\"text-align:right;font-weight:600;color:var(--effect-node)\">2×<\u002Fspan><span>control_failure_pct<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--ink-1);padding:14px 16px\">\n      <div style=\"font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);margin-bottom:11px\">Contoh dengan 100 satker<\u002Fdiv>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">\n        <sc-raw-tbody>\n          <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n            <sc-raw-td style=\"padding:5px 8px 5px 0;vertical-align:top\">12 satker terdampak<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:5px 0 5px 0;vertical-align:top;text-align:right\">2×12 = 24<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n            <sc-raw-td style=\"padding:5px 8px 5px 0;vertical-align:top\">5 satker berdampak tinggi<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:5px 0 5px 0;vertical-align:top;text-align:right\">4×5 = 20<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n            <sc-raw-td style=\"padding:5px 8px 5px 0;vertical-align:top\">4 satker berulang<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:5px 0 5px 0;vertical-align:top;text-align:right\">4×4 = 16<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-bottom:1.5px solid var(--ink-1)\">\n            <sc-raw-td style=\"padding:5px 8px 5px 0;vertical-align:top\">8 satker kegagalan kontrol<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:5px 0 5px 0;vertical-align:top;text-align:right\">2×8 = 16<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:8px 8px 0 0;vertical-align:top;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--ink-3)\">Skor B<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px 0 0 0;vertical-align:top;text-align:right;font-size:16px;font-weight:700;color:var(--effect-node)\">76<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:16px 0 0\">Satu satker dihitung satu kali pada setiap metrik walaupun memiliki banyak event. Pendekatan ini mencegah dominasi oleh volume satu satker.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"bab-7\" style=\"margin-top:38px\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 7<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Fusi Insight A dan B<\u002Fh2>\n  <div style=\"border:1.5px solid var(--ink-1);padding:18px;margin:0 0 18px;text-align:center;break-inside:avoid\">\n    <div style=\"font-family:var(--font-ui);font-size:16px;font-weight:600;letter-spacing:.02em;color:var(--ink-1)\">priority_score = 0,45 × A &nbsp;+&nbsp; 0,55 × B<\u002Fdiv>\n  <\u002Fdiv>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.45\">\n    <sc-raw-thead style=\"font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);text-align:left\">\n      <sc-raw-tr style=\"border-bottom:1.5px solid var(--ink-1)\">\n        <sc-raw-th style=\"padding:0 10px 7px 0;width:42%\">Aturan<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:0 0 7px 0\">Label<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">A ≥ 55 &amp;&amp; B ≥ 45<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;color:var(--effect-node);font-weight:600\">prioritas_nasional<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">A ≥ 55 &amp;&amp; B &lt; 45<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">preventif<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">A &lt; 55 &amp;&amp; B ≥ 45<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">perbaikan_kontrol<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--hairline)\">\n        <sc-raw-td style=\"padding:7px 10px 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">selain itu<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:7px 0 7px 0;vertical-align:top;font-family:var(--font-ui);font-size:12px;color:var(--ink-1)\">monitoring<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"margin:16px 0 0\">Ambang tersebut merupakan aturan keputusan internal versi metode, bukan konstanta ilmiah universal. Karena itu method version dan semua komponen disimpan pada snapshot agar dapat diaudit dan dikalibrasi menggunakan data historis.<\u002Fp>\n\n  <h3 style=\"margin:28px 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">7.1 &nbsp;Baseline dan target berbantuan<\u002Fh3>\n  <p style=\"margin:0 0 14px\">Baseline Outcome A dipilih menurut <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">signalKey<\u002Fspan> rekomendasi: proporsi objek uang, keterlambatan, missing context, jabatan prioritas, bulan puncak, relasi eksternal, atau skenario dominan. Target awal mesin:<\u002Fp>\n  <div style=\"border:1.5px solid var(--ink-1);padding:16px 18px;margin:0 0 14px;break-inside:avoid;display:grid;gap:9px;font-family:var(--font-ui);font-size:13px;color:var(--ink-1)\">\n    <div style=\"border-bottom:1px solid var(--hairline);padding-bottom:8px\">target_A = baseline_A × 0,80<\u002Fdiv>\n    <div>target_B = affected_pct × 0,75<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0\">Keduanya hanya saran awal. UPG Pusat menetapkan target final. KRI default memakai ambang <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">&lt;5%<\u002Fspan>, <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">5–10%<\u002Fspan>, dan <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">&gt;10%<\u002Fspan> serta dapat disesuaikan sebelum program disimpan.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"bab-8\" style=\"margin-top:38px;break-inside:avoid\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 8<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Klasterisasi Satker<\u002Fh2>\n  <p style=\"margin:0 0 16px\">Untuk satu risiko generik utama dan satu periode analisis:<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n    <div style=\"border:1.5px solid var(--effect-edge)\">\n      <div style=\"background:var(--effect-node);color:#fff;padding:7px 11px;font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Klaster 1 · Realisasi kritis<\u002Fdiv>\n      <div style=\"padding:12px;font-family:var(--font-ui);font-size:12px;color:var(--ink-1);line-height:1.5\">event_count ≥ 2<br><span style=\"color:var(--ink-3)\">OR<\u002Fspan><br>highest_impact ≥ 4<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--ink-1)\">\n      <div style=\"background:var(--ink-1);color:#fff;padding:7px 11px;font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Klaster 2 · Preventif<\u002Fdiv>\n      <div style=\"padding:12px;font-family:var(--font-ui);font-size:12px;color:var(--ink-1);line-height:1.5\">event_count = 1<br><span style=\"color:var(--ink-3)\">AND<\u002Fspan><br>highest_impact &lt; 4<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--ink-3)\">\n      <div style=\"background:var(--ink-3);color:#fff;padding:7px 11px;font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\">Klaster 3 · Monitoring<\u002Fdiv>\n      <div style=\"padding:12px;font-family:var(--font-ui);font-size:12px;color:var(--ink-1);line-height:1.5\">event_count = 0<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:16px 0 0\">Keanggotaan disimpan sebagai snapshot pada program. Perubahan loss event setelah program disahkan tidak mengubah keanggotaan historis secara diam-diam.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"bab-9\" style=\"break-before:page;padding-top:12px\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 9<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Database Schema dan ERD<\u002Fh2>\n\n  <h3 style=\"margin:22px 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">9.1 &nbsp;Tabel domain utama<\u002Fh3>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.4\">\n    <sc-raw-thead style=\"font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);text-align:left\">\n      <sc-raw-tr style=\"border-bottom:1.5px solid var(--ink-1)\">\n        <sc-raw-th style=\"padding:0 10px 7px 0;width:24%\">Tabel<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:0 10px 7px 0;width:38%\">Kolom kunci dan tipe<\u0 ight:7px;background:var(--hairline)\"><\u002Fspan><span style=\"height:7px;width:80%;background:var(--hairline)\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;padding:11px\">\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Control Library<\u002Fdiv>\n          <div style=\"display:grid;gap:5px\"><span style=\"height:7px;background:var(--hairline)\"><\u002Fspan><span style=\"height:7px;background:var(--hairline)\"><\u002Fspan><span style=\"height:7px;width:66%;background:var(--hairline)\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"margin-top:9px;font-family:var(--font-ui);font-size:11px;line-height:1.5;color:var(--ink-3)\">Gambar 4 — Wireframe Risk and Control Library. Tombol approve disabled secara fungsional bila field wajib tidak valid; bukti anggota collapsed secara default; field yang tidak diekstrak kosong; duplicate file hash ditolak.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h3 style=\"margin:30px 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">11.2 &nbsp;Penilaian Risiko<\u002Fh3>\n  <figure style=\"margin:0 0 16px;break-inside:avoid\">\n    <div style=\"border:1.5px solid var(--ink-1);font-family:var(--font-ui);font-size:11px;color:var(--ink-1)\">\n      <div style=\"border-bottom:1px solid var(--hairline);padding:10px 12px;display:flex;justify-content:space-between;gap:10px\"><span>Import operasional<\u002Fspan><span style=\"border:1px solid var(--ink-3);padding:3px 8px;font-size:10px;color:var(--ink-2)\">Download template<\u002Fspan><\u002Fdiv>\n      <div style=\"border-bottom:1px solid var(--hairline);padding:10px 12px;display:flex;justify-content:space-between;gap:10px\"><span>Draf staging: generic risk + inherent + residual<\u002Fspan><span style=\"border:1.5px solid var(--ink-1);background:var(--ink-1);color:#fff;padding:3px 10px;font-size:10px;font-weight:600\">Buat<\u002Fspan><\u002Fdiv>\n      <div style=\"border-bottom:1px solid var(--hairline);padding:10px 12px\">Form penilaian manual inherent/residual<\u002Fdiv>\n      <div style=\"border-bottom:1px solid var(--hairline);padding:10px 12px\">Form treated risk pasca-program<\u002Fdiv>\n      <div style=\"border-bottom:1px solid var(--hairline);padding:12px\">\n        <div style=\"font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3);margin-bottom:9px\">Matriks residual risk 5×5<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,26px);grid-template-rows:repeat(5,18px);gap:2px\">\n          <span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan>\n          <span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan>\n          <span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--effect-node);background:var(--effect-node)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan>\n          <span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan>\n          <span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan><span style=\"border:1px solid var(--hairline)\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid var(--hairline);padding:10px 12px\">Bukti dan validasi kontrol<\u002Fdiv>\n      <div style=\"padding:12px\">\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:9px\">\n          <span style=\"border-bottom:1.5px solid var(--ink-1);padding-bottom:4px;font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3)\">Inherent<\u002Fspan>\n          <span style=\"border-bottom:1.5px solid var(--ink-1);padding-bottom:4px;font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3)\">Residual<\u002Fspan>\n          <span style=\"border-bottom:1.5px solid var(--ink-1);padding-bottom:4px;font-size:10px;font-weight:600;letter-spacing:var(--ls-head);text-transform:uppercase;color:var(--ink-3)\">Treated<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:5px\"><span style=\"height:7px;background:var(--hairline)\"><\u002Fspan><span style=\"height:7px;background:var(--hairline)\"><\u002Fspan><span style=\"height:7px;width:74%;background:var(--hairline)\"><\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:9px;font-size:10px;color:var(--ink-3)\">search · pagination<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"margin-top:9px;font-family:var(--font-ui);font-size:11px;line-height:1.5;color:var(--ink-3)\">Gambar 5 — Wireframe Penilaian Risiko: impor operasional, draf staging, form manual, treated risk, matriks residual, dan tabel tiga titik ukur.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h3 style=\"margin:30px 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">11.3 &nbsp;Titik Rawan dan Program PPG<\u002Fh3>\n  <figure style=\"margin:0;break-inside:avoid\">\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px;font-family:var(--font-ui);font-size:11px;color:var(--ink-1)\">\n      <div style=\"border:1.5px solid var(--ink-1)\">\n        <div style=\"border-bottom:1.5px solid var(--ink-1);padding:8px 11px;font-size:11px;font-weight:600\">Titik Rawan<\u002Fdiv>\n        <div style=\"border-bottom:1px solid var(--hairline);padding:9px 11px;font-size:10.5px;color:var(--ink-2)\">Filter tahun/triwulan · kualitas &amp; cakupan data<\u002Fdiv>\n        <div style=\"border-bottom:1px solid var(--hairline);padding:11px;display:grid;grid-template-columns:1.3fr 1fr;gap:10px\">\n          <div>\n            <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px\">Scatter A×B<\u002Fdiv>\n            <div style=\"border-left:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);height:64px;position:relative\">\n              <span style=\"position:absolute;left:22%;bottom:30%;width:7px;height:7px;background:var(--cause-node)\"><\u002Fspan>\n              <span style=\"position:absolute;left:54%;bottom:58%;width:7px;height:7px;background:var(--effect-node)\"><\u002Fspan>\n              <span style=\"position:absolute;left:72%;bottom:22%;width:7px;height:7px;background:var(--cause-node)\"><\u002Fspan>\n              <span style=\"position:absolute;left:38%;bottom:74%;width:7px;height:7px;background:var(--effect-node)\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px\">Kartu kandidat fusi<\u002Fdiv>\n            <div style=\"display:grid;gap:6px\">\n              <span style=\"border:1px solid var(--hairline);height:17px\"><\u002Fspan>\n              <span style=\"border:1px solid var(--hairline);height:17px\"><\u002Fspan>\n              <span style=\"border:1px solid var(--hairline);height:17px\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-bottom:1px solid var(--hairline);padding:9px 11px;font-size:10.5px;color:var(--ink-2)\">tren · musim · ranking · asosiasi<\u002Fdiv>\n        <div style=\"border-bottom:1px solid var(--hairline);padding:9px 11px;font-size:10.5px;color:var(--ink-2)\">Tabel Insight B nasional<\u002Fdiv>\n        <div style=\"padding:11px\"><span style=\"border:1.5px solid var(--ink-1);background:var(--ink-1);color:#fff;padding:5px 11px;font-size:10.5px;font-weight:600\">Buat draf berbantuan<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1.5px solid var(--ink-1)\">\n        <div style=\"border-bottom:1.5px solid var(--ink-1);padding:8px 11px;font-size:11px;font-weight:600\">Program PPG<\u002Fdiv>\n        <div style=\"border-bottom:1px solid var(--hairline);padding:9px 11px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;font-size:10px;color:var(--ink-2)\"><span>risiko utama<\u002Fspan><span>tindakan<\u002Fspan><span>controls<\u002Fspan><\u002Fdiv>\n        <div style=\"border-bottom:1px solid var(--hairline);padding:11px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px\">\n          <div style=\"border:1px solid var(--cause-node);padding:7px;font-size:10px;color:var(--cause-node)\">panel A<\u002Fdiv>\n          <div style=\"border:1px solid var(--effect-node);padding:7px;font-size:10px;color:var(--effect-node)\">panel B<\u002Fdiv>\n          <div style=\"border:1px solid var(--hairline);padding:7px;font-size:10px;color:var(--ink-2)\">rincian formula A<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-bottom:1px solid var(--hairline);padding:9px 11px;font-size:10.5px;color:var(--ink-2)\">KRI · baseline &amp; target outcome A/B<\u002Fdiv>\n        <div style=\"border-bottom:1px solid var(--hairline);padding:11px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px\">\n          <div style=\"border:1px solid var(--effect-node);padding:7px;font-size:10px;color:var(--effect-node)\">klaster 1<\u002Fdiv>\n          <div style=\"border:1px solid var(--ink-1);padding:7px;font-size:10px;color:var(--ink-1)\">klaster 2<\u002Fdiv>\n          <div style=\"border:1px solid var(--ink-3);padding:7px;font-size:10px;color:var(--ink-3)\">klaster 3<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:11px;display:flex;justify-content:space-between;align-items:center;gap:10px\">\n          <span style=\"font-size:10.5px;color:var(--ink-2)\">jadwal · PIC · target<\u002Fspan>\n          <span style=\"border:1.5px solid var(--ink-1);background:var(--ink-1);color:#fff;padding:5px 11px;font-size:10.5px;font-weight:600\">Simpan rancangan<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"margin-top:9px;font-family:var(--font-ui);font-size:11px;line-height:1.5;color:var(--ink-3)\">Gambar 6 — Wireframe Titik Rawan (kiri) dan penyusunan Program PPG (kanan).<\u002Ffigcaption>\n  <\u002Ffigure>\n<\u002Fsection>\n\n<section id=\"bab-12\" style=\"break-before:page;padding-top:12px\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 12<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Validasi, Konsistensi, dan Error Handling<\u002Fh2>\n  <div style=\"display:grid;gap:0;font-size:14.5px\">\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Semua UUID yang berasal dari form divalidasi formatnya.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Referensi library/action/control harus aktif dan relasinya diperiksa ulang di server.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Persentase dibatasi 0–100; K/D dibatasi 1–5; progres dibatasi 0–100.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Rentang tanggal harus valid dan tanggal mulai tidak boleh melebihi tanggal akhir.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">File identik pada sheet dan mode yang sama ditolak berdasarkan SHA-256.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Batch gagal diberi status <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">gagal<\u002Fspan> dan menyimpan catatan error.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Constraint migrasi lama ditambahkan secara idempotent menggunakan <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">IF NOT EXISTS<\u002Fspan> dan <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">DROP ... IF EXISTS<\u002Fspan>.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Constraint <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">NOT VALID<\u002Fspan> dipakai pada beberapa upgrade agar data historis tidak menggagalkan instalasi, sementara baris baru tetap diperiksa.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);padding:9px 0\">Tabel memiliki RLS; policy pusat dibuat generik, sedangkan register/loss event memiliki policy khusus satker.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"bab-13\" style=\"margin-top:38px\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 13<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Privasi, Audit, dan Retensi<\u002Fh2>\n  <div style=\"display:grid;gap:0;font-size:14.5px\">\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Data laporan gratifikasi tidak menyimpan nama, NIK, nama pemberi, alamat, kontak, atau tanggal lahir.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Bukti LED berada pada bucket privat <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">ppg-led-bukti<\u002Fspan>, batas 10 MB, MIME PDF/JPEG/PNG/WebP.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Link bukti diberikan sebagai signed URL berdurasi terbatas.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Source row, source sheet, file hash, raw payload terbatas, similarity, reviewer, dan timestamps menjaga lineage.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Penghapusan akun mengosongkan actor/reference user tanpa menghapus histori organisasi.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);padding:9px 0\">Snapshot program tidak boleh dihitung ulang secara diam-diam setelah program ditetapkan.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"bab-14\" style=\"margin-top:38px\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 14<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Strategi Pengujian<\u002Fh2>\n\n  <h3 style=\"margin:22px 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">14.1 &nbsp;Unit/integration checks<\u002Fh3>\n  <div style=\"display:grid;gap:0;font-size:14.5px;margin-bottom:26px\">\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Workbook valid dikenali dan sheet salah ditolak.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Tahun/triwulan dan baris data terbaca sesuai sel baku.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Fill-down unit bekerja.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Residual dan treated tetap <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">null<\u002Fspan> setelah parsing.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Similarity identik = 100 dan threshold grouping konsisten.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Formula skor risiko dan batas level benar.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Insight A menyimpan lima kontribusi yang totalnya sama dengan skor A.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);padding:9px 0\">Insight B menggunakan distinct satker, bukan event count.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);padding:9px 0\">Role dan ownership diuji untuk setiap command.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"margin:0 0 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-1);break-after:avoid\">14.2 &nbsp;Acceptance criteria<\u002Fh3>\n  <div style=\"display:grid;gap:0;font-size:14.5px\">\n    <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid var(--hairline);padding:9px 0\"><span style=\"font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--effect-node)\">01<\u002Fspan><span>UPG Pusat dapat mengimpor template dan melihat kandidat beserta evidence.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid var(--hairline);padding:9px 0\"><span style=\"font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--effect-node)\">02<\u002Fspan><span>Kandidat tidak masuk Risk Library tanpa keputusan eksplisit.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid var(--hairline);padding:9px 0\"><span style=\"font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--effect-node)\">03<\u002Fspan><span>UPG Satker hanya dapat membuat register untuk unitnya.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid var(--hairline);padding:9px 0\"><span style=\"font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--effect-node)\">04<\u002Fspan><span>Field yang tidak tersedia pada template tetap kosong.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid var(--hairline);padding:9px 0\"><span style=\"font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--effect-node)\">05<\u002Fspan><span>Penilaian menampilkan inherent, residual, dan treated secara terpisah.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid var(--hairline);padding:9px 0\"><span style=\"font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--effect-node)\">06<\u002Fspan><span>Insight A/B dapat dijelaskan dari raw metric, normalisasi, bobot, dan formula.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid var(--hairline);padding:9px 0\"><span style=\"font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--effect-node)\">07<\u002Fspan><span>Program tidak dapat disimpan tanpa satu risiko generik, tindakan, kontrol, KRI, target, dan tanggal yang valid.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid var(--hairline);padding:9px 0\"><span style=\"font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--effect-node)\">08<\u002Fspan><span>Keanggotaan tiga klaster tersimpan sebagai snapshot.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);padding:9px 0\"><span style=\"font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--effect-node)\">09<\u002Fspan><span>Build TypeScript dan pengujian PPG lulus.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"bab-15\" style=\"margin-top:38px;break-inside:avoid\">\n  <div style=\"font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Bab 15<\u002Fdiv>\n  <h2 style=\"margin:0 0 16px;border-top:2px solid var(--ink-1);padding-top:12px;font-family:var(--font-text);font-size:22px;font-weight:600;letter-spacing:var(--ls-title);color:var(--ink-1);break-after:avoid\">Operasional Migrasi<\u002Fh2>\n  <p style=\"margin:0 0 12px\">Jalankan <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">supabase/migration_ppg.sql<\u002Fspan> melalui Supabase SQL Editor pada proyek yang benar, lalu reload schema cache/API bila diperlukan. Setelah migrasi, verifikasi keberadaan tabel staging, kolom treated, policy RLS, indeks, fungsi helper, trigger kode LED, dan bucket privat. Aplikasi harus menampilkan pesan skema terbaru bila query ke struktur yang diwajibkan gagal.<\u002Fp>\n  <p style=\"margin:0\">Untuk instalasi lama, kolom <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">kemungkinan_existing<\u002Fspan>, <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">dampak_existing<\u002Fspan>, <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">skor_existing<\u002Fspan>, dan <span style=\"font-family:var(--font-ui);font-size:12.5px;color:var(--ink-1)\">level_existing<\u002Fspan> tidak di-rename agar kompatibilitas terjaga. Seluruh UI, dokumentasi, dan logika baru memperlakukannya sebagai <strong style=\"color:var(--ink-1);font-weight:600\">residual risk<\u002Fstrong>.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDaftarIsi&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Kelengkapan dokumen&quot;},&quot;showRevisi&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Kelengkapan dokumen&quot;},&quot;showPengesahan&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Kelengkapan dokumen&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const p = this.props || {};\n    return {\n      showDaftarIsi: p.showDaftarIsi ?? true,\n      showRevisi: p.showRevisi ?? true,\n      showPengesahan: p.showPengesahan ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
